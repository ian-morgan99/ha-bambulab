name: Publish

on:
  release:
    types:
      - created  # Trigger when release is first created (as draft or published)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to update (e.g., v1.0.0.2)'
        required: true
        type: string

jobs:
  release_zip_file:
    name: Run automations to build latest release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛍️ Checkout the repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 💿 Install Dependencies
        run: pip install -r requirements.txt
        working-directory: "${{ github.workspace }}/scripts"

      - name: 📝 Update manifest version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.tag }}"
          fi
          VERSION="${VERSION#v}"  # Remove 'v' prefix if it exists
          sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/' '${{ github.workspace }}/custom_components/bambu_lab/manifest.json'

      - name: 🤐 Copy and Zip
        run: |
          cd '${{ github.workspace }}/custom_components/bambu_lab'
          zip bambu_lab.zip -r ./

      - name: ☁️ Upload zip to release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
          files: "${{ github.workspace }}/custom_components/bambu_lab/bambu_lab.zip"
